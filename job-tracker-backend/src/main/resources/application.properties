# Application
spring.application.name=job-tracker-backend
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:ChangeThisLocalDevelopmentJwtSecretBeforeDeployment123456789}
app.jwt.expiration=86400000

# Frontend CORS
app.cors.allowed-origin=http://localhost:5173

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.premium-amount=99900

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Email Notification (Gmail SMTP)
# Keep disabled until Gmail App Password is configured.
app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your gmail}
spring.mail.password=${MAIL_PASSWORD:16 letter app password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Notification scheduler
app.notification.scheduler-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:30000}

# Automatic Gmail inbox tracking (disabled until configured)
app.mail-tracking.enabled=${MAIL_TRACKING_ENABLED:true}
app.mail-tracking.imap-host=${MAIL_TRACKING_IMAP_HOST:imap.gmail.com}
app.mail-tracking.imap-port=${MAIL_TRACKING_IMAP_PORT:993}
app.mail-tracking.username=${MAIL_TRACKING_USERNAME:your@gmail.com}
app.mail-tracking.password=${MAIL_TRACKING_PASSWORD:16 letter app password}
# Must match the email address of the user account in this Job Tracker database.
app.mail-tracking.owner-email=${MAIL_TRACKING_OWNER_EMAIL:your@gmail.com}
app.mail-tracking.poll-interval-ms=${MAIL_TRACKING_POLL_INTERVAL_MS:60000}
